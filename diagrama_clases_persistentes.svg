<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="1900" viewBox="0 0 2360 1900">
<defs><style>
*{box-sizing:border-box} text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.title{font-size:30px;font-weight:bold}.sub{font-size:17px;fill:#444}.box{fill:#fff7f1;stroke:#242424;stroke-width:2}.head{fill:#f4e0d3;stroke:#242424;stroke-width:2}.name{font-size:20px;font-weight:bold}.attr{font-size:16px}.rel{stroke:#252525;stroke-width:2;fill:none}.rlabel{font-size:15px}.mult{font-size:15px;font-weight:bold}.note{font-size:15px;fill:#333}
</style></defs>
<rect width="2360" height="1900" fill="#fafafa"/>
<text x="60" y="55" class="title">Diagrama de clases persistentes</text><text x="60" y="85" class="sub">Miss Uñas Valentina — Base de datos bdbella</text>
<!-- asociaciones detrás de las clases -->
<g class="rel">
<!-- Cliente -->
<path d="M680 300 H730 V520 H785"/><path d="M680 270 H760 V890 H785"/><path d="M680 320 H740 V1300 H785"/><path d="M680 350 H715 V1660 H785"/>
<!-- Servicio -->
<path d="M1155 300 H1200 V520 H1245"/><path d="M1155 300 H1220 V890 H1245"/><path d="M1155 300 H1240 V1300 H1245"/><path d="M1155 300 H1260 V1660 H1245"/>
<!-- Usuario -->
<path d="M680 700 H735 V520 H785"/><path d="M680 700 H750 V890 H785"/><path d="M680 700 H765 V1300 H785"/><path d="M680 700 H780 V1660 H785"/>
<!-- inventory -->
<path d="M1155 700 H1200 V520 H1245"/><path d="M1155 700 H1215 V890 H1245"/><path d="M1155 700 H1230 V1300 H1245"/>
<!-- purchase/retail details -->
<path d="M1615 700 H1660 V520 H1705"/><path d="M1615 700 H1680 V890 H1705"/><path d="M1615 700 H1700 V1300 H1705"/><path d="M1615 700 H1720 V1660 H1705"/>
<path d="M1615 1100 H1665 V890 H1705"/><path d="M1615 1100 H1685 V1300 H1705"/>
<path d="M1615 1500 H1660 V1300 H1705"/><path d="M1615 1500 H1680 V1660 H1705"/>
</g>
<!-- labels and cardinalities -->
<g class="rlabel">
<text x="730" y="400">realiza</text><text x="735" y="765">realiza</text><text x="700" y="1120">realiza</text><text x="690" y="1480">realiza</text>
<text x="1190" y="400">incluye</text><text x="1200" y="765">incluye</text><text x="1210" y="1120">asigna</text><text x="1220" y="1480">asigna</text>
<text x="1650" y="400">contiene</text><text x="1660" y="765">contiene</text><text x="1670" y="1120">asocia</text><text x="1680" y="1480">registra</text>
</g>
<g class="mult">
<text x="690" y="288">1</text><text x="765" y="510">0..*</text><text x="690" y="690">1</text><text x="765" y="880">0..*</text>
<text x="1165" y="288">1</text><text x="1225" y="510">0..*</text><text x="1165" y="690">1</text><text x="1230" y="880">0..*</text>
<text x="1625" y="690">1</text><text x="1690" y="510">0..*</text><text x="1625" y="1090">1</text><text x="1690" y="880">0..*</text>
</g>
<!-- class cards -->
<g>
<!-- row 1 -->
<g transform="translate(70 150)"><rect class="box" width="610" height="220" rx="5"/><path class="head" d="M5 0H605Q610 0 610 5V44H0V5Q0 0 5 0Z"/><text class="name" x="305" y="29" text-anchor="middle">Clientes</text><path stroke="#242424" d="M0 44H610"/><text class="attr" x="18" y="72">- id_cliente: int {PK}</text><text class="attr" x="18" y="96">- nombre: varchar(50)</text><text class="attr" x="18" y="120">- apellido: varchar(100)</text><text class="attr" x="18" y="144">- telefono: varchar(20)</text><text class="attr" x="18" y="168">- email: varchar(50)</text></g>
<g transform="translate(785 150)"><rect class="box" width="370" height="220" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">Reservas</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- id_reserva: int {PK}</text><text class="attr" x="15" y="96">- id_cliente: int {FK}</text><text class="attr" x="15" y="120">- id_servicio: int {FK}</text><text class="attr" x="15" y="144">- id_usuario: int {FK}</text><text class="attr" x="15" y="168">- fecha: date · hora: time</text><text class="attr" x="15" y="192">- subtotal · adelanto · estado</text></g>
<g transform="translate(1245 150)"><rect class="box" width="370" height="220" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">Atencion</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- id_atencion: int {PK}</text><text class="attr" x="15" y="96">- id_cliente: int {FK}</text><text class="attr" x="15" y="120">- id_servicio: int {FK}</text><text class="attr" x="15" y="144">- id_usuario: int {FK}</text><text class="attr" x="15" y="168">- fecha: date · hora: time</text><text class="attr" x="15" y="192">- observaciones · estado · total</text></g>
<g transform="translate(1705 150)"><rect class="box" width="590" height="220" rx="5"/><path class="head" d="M5 0H585Q590 0 590 5V44H0V5Q0 0 5 0Z"/><text class="name" x="295" y="29" text-anchor="middle">Ventas</text><path stroke="#242424" d="M0 44H590"/><text class="attr" x="18" y="72">- id_venta: int {PK}</text><text class="attr" x="18" y="96">- id_cliente: int {FK}</text><text class="attr" x="18" y="120">- id_usuario: int {FK}</text><text class="attr" x="18" y="144">- fecha: date</text><text class="attr" x="18" y="168">- total: decimal(10,2)</text></g>
<!-- row 2 -->
<g transform="translate(70 520)"><rect class="box" width="610" height="250" rx="5"/><path class="head" d="M5 0H605Q610 0 610 5V44H0V5Q0 0 5 0Z"/><text class="name" x="305" y="29" text-anchor="middle">Usuario</text><path stroke="#242424" d="M0 44H610"/><text class="attr" x="18" y="72">- id_usuario: int {PK}</text><text class="attr" x="18" y="96">- username: varchar(50)</text><text class="attr" x="18" y="120">- email: varchar(100)</text><text class="attr" x="18" y="144">- password: varchar(255)</text><text class="attr" x="18" y="168">- rol · pago · estado: varchar</text><text class="attr" x="18" y="192">- fecha_creacion: timestamp</text></g>
<g transform="translate(785 520)"><rect class="box" width="370" height="250" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">Servicios</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- id_servicio: int {PK}</text><text class="attr" x="15" y="96">- nombre: varchar(50)</text><text class="attr" x="15" y="120">- descripcion: varchar(100)</text><text class="attr" x="15" y="144">- precio: decimal(10,2)</text></g>
<g transform="translate(1245 520)"><rect class="box" width="370" height="250" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">Especialidades</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- id_especialidad: int {PK}</text><text class="attr" x="15" y="96">- id_usuario: int {FK}</text><text class="attr" x="15" y="120">- id_servicio: int {FK}</text><text class="attr" x="15" y="144">- UNIQUE(id_usuario,id_servicio)</text></g>
<g transform="translate(1705 520)"><rect class="box" width="590" height="250" rx="5"/><path class="head" d="M5 0H585Q590 0 590 5V44H0V5Q0 0 5 0Z"/><text class="name" x="295" y="29" text-anchor="middle">DetalleVenta</text><path stroke="#242424" d="M0 44H590"/><text class="attr" x="18" y="72">- id_detalle: int {PK}</text><text class="attr" x="18" y="96">- id_venta: int {FK}</text><text class="attr" x="18" y="120">- id_producto: int {FK}</text><text class="attr" x="18" y="144">- cantidad: int</text><text class="attr" x="18" y="168">- precioventa: decimal(10,2)</text></g>
<!-- row 3 -->
<g transform="translate(70 890)"><rect class="box" width="610" height="250" rx="5"/><path class="head" d="M5 0H605Q610 0 610 5V44H0V5Q0 0 5 0Z"/><text class="name" x="305" y="29" text-anchor="middle">Categorias</text><path stroke="#242424" d="M0 44H610"/><text class="attr" x="18" y="72">- id_categoria: int {PK}</text><text class="attr" x="18" y="96">- nombre: varchar(50)</text></g>
<g transform="translate(785 890)"><rect class="box" width="370" height="250" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">Compras</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- id_compra: int {PK}</text><text class="attr" x="15" y="96">- id_proveedor: int {FK}</text><text class="attr" x="15" y="120">- id_usuario: int</text><text class="attr" x="15" y="144">- total: decimal(10,2)</text><text class="attr" x="15" y="168">- fecha: datetime</text></g>
<g transform="translate(1245 890)"><rect class="box" width="370" height="250" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">Marca</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- idmarca: int {PK}</text><text class="attr" x="15" y="96">- nombre: varchar(200)</text></g>
<g transform="translate(1705 890)"><rect class="box" width="590" height="250" rx="5"/><path class="head" d="M5 0H585Q590 0 590 5V44H0V5Q0 0 5 0Z"/><text class="name" x="295" y="29" text-anchor="middle">DetalleCompra</text><path stroke="#242424" d="M0 44H590"/><text class="attr" x="18" y="72">- id_detalle: int {PK}</text><text class="attr" x="18" y="96">- id_compra: int {FK}</text><text class="attr" x="18" y="120">- id_producto: int {FK}</text><text class="attr" x="18" y="144">- cantidad: int</text><text class="attr" x="18" y="168">- precio: decimal(10,2)</text></g>
<!-- row 4 -->
<g transform="translate(70 1260)"><rect class="box" width="610" height="250" rx="5"/><path class="head" d="M5 0H605Q610 0 610 5V44H0V5Q0 0 5 0Z"/><text class="name" x="305" y="29" text-anchor="middle">Proveedores</text><path stroke="#242424" d="M0 44H610"/><text class="attr" x="18" y="72">- id_proveedor: int {PK}</text><text class="attr" x="18" y="96">- nombre: varchar(100)</text><text class="attr" x="18" y="120">- apellido: varchar(100)</text><text class="attr" x="18" y="144">- telefono: varchar(20)</text><text class="attr" x="18" y="168">- direccion: text · email: varchar(100)</text></g>
<g transform="translate(785 1260)"><rect class="box" width="370" height="250" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">LoteProducto</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- idlote: int {PK}</text><text class="attr" x="15" y="96">- idproducto: int {FK}</text><text class="attr" x="15" y="120">- fecha_caducidad: date</text><text class="attr" x="15" y="144">- cantidad_producto_lote:</text><text class="attr" x="15" y="168">  varchar(200)</text></g>
<g transform="translate(1245 1260)"><rect class="box" width="370" height="250" rx="5"/><path class="head" d="M5 0H365Q370 0 370 5V44H0V5Q0 0 5 0Z"/><text class="name" x="185" y="29" text-anchor="middle">Producto</text><path stroke="#242424" d="M0 44H370"/><text class="attr" x="15" y="72">- id_producto: int {PK}</text><text class="attr" x="15" y="96">- descripcion: text · color</text><text class="attr" x="15" y="120">- imagen: varchar(255)</text><text class="attr" x="15" y="144">- stock: int</text><text class="attr" x="15" y="168">- preciocompra · precioventa</text><text class="attr" x="15" y="192">- id_categoria: int {FK}</text><text class="attr" x="15" y="216">- idmarca: int {FK} · id_proveedor: FK</text><text class="attr" x="15" y="240">- idlote: int (sin FK declarada)</text></g>
<g transform="translate(1705 1260)"><rect class="box" width="590" height="250" rx="5"/><path class="head" d="M5 0H585Q590 0 590 5V44H0V5Q0 0 5 0Z"/><text class="name" x="295" y="29" text-anchor="middle">Ventas / Compras — líneas de detalle</text><path stroke="#242424" d="M0 44H590"/><text class="attr" x="18" y="72">Producto participa en DetalleVenta y DetalleCompra.</text><text class="attr" x="18" y="96">La FK de producto está declarada en ambas tablas</text><text class="attr" x="18" y="120">de detalle; FK desde Producto hacia lote no declarada.</text><text class="attr" x="18" y="156">{PK} clave primaria · {FK} clave foránea</text></g>
<!-- bottom notes -->
<g transform="translate(70 1660)"><rect class="box" width="610" height="170" rx="5"/><path class="head" d="M5 0H605Q610 0 610 5V44H0V5Q0 0 5 0Z"/><text class="name" x="305" y="29" text-anchor="middle">Convenciones y observaciones</text><path stroke="#242424" d="M0 44H610"/><text class="note" x="15" y="72">1 — lado uno · 0..* — cero o muchos</text><text class="note" x="15" y="98">Se dibujan solo relaciones con FK declarada.</text><text class="note" x="15" y="124">compras.id_usuario no tiene FK en el SQL.</text></g>
<g transform="translate(785 1660)"><rect class="box" width="830" height="170" rx="5"/><path class="head" d="M5 0H825Q830 0 830 5V44H0V5Q0 0 5 0Z"/><text class="name" x="415" y="29" text-anchor="middle">Relaciones de venta y compra con detalles</text><path stroke="#242424" d="M0 44H830"/><text class="note" x="15" y="72">Las asociaciones Venta → DetalleVenta, Compra → DetalleCompra y</text><text class="note" x="15" y="98">Producto → ambos detalles se derivan de las claves foráneas declaradas.</text><text class="note" x="15" y="124">Diagrama esquemático; campos agrupados para mejorar la legibilidad.</text></g>
</g>
</svg>

